<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Downloads | Cecotein</title>
    <link rel="icon" href="../assets/[REDACTED_DB_USERNAME]_logo01.png">
    <style>
        :root{--amarelo:#FFD60A;--preto:#1a1a1a;--branco:#fff}
        body{font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#FAE5B3;color:#222;margin:0}
        header{background:var(--branco);padding:14px 20px;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:1000}
        .header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:6px 0}
        .brand-title{font-weight:800;font-size:20px;color:var(--preto);margin-left:8px}
        .page{max-width:1200px;margin:28px auto;padding:0 20px}
        .card{background:#ffffff;border-radius:12px;padding:28px;border:1px solid rgba(0,0,0,.06)}
        .login{max-width:680px;width:100%;margin:24px auto;padding:28px 32px}
        .login input{width:100%;padding:14px 12px;margin-top:8px;border-radius:8px;border:1px solid #ddd;font-size:15px}
        .btn{display:inline-block;padding:10px 18px;border-radius:8px;border:none;background:var(--preto);color:var(--branco);cursor:pointer}
        .btn.secondary{background:transparent;color:var(--preto);border:1px solid rgba(0,0,0,.12)}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
        .file-card{padding:16px;border-radius:12px;background:#fff;border:1px solid rgba(0,0,0,.06);display:flex;flex-direction:column;gap:8px}
        .file-meta{display:flex;justify-content:space-between;color:#666;font-size:13px}
        .hidden{display:none}
        .message{padding:12px;border-radius:8px;margin-bottom:12px}
        .success{background:#e8f5e9;color:#176f3d}
        .error{background:#fdecea;color:#8f1d2d}
        form.upload{display:grid;gap:10px}
        @media(max-width:640px){.header-inner{flex-direction:column;align-items:flex-start}.btn{width:100%}}
        .login-wrapper{min-height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;padding:20px}
    </style>
</head>
<body>
<header>
    <div class="header-inner">
        <div class="brand">
            <a href="../index.html"><img src="../assets/[REDACTED_DB_USERNAME]_logo01.png" alt="logo" style="height:50px;vertical-align:middle"></a>
            <span class="brand-title">[REDACTED_DOWNLOAD_USERNAME] Downloads</span>
        </div>
        <nav>
            <a class="btn secondary" id="logoutBtn" href="#" style="display:none">Sair</a>
        </nav>
    </div>
</header>

<main class="page">
    <div class="login-wrapper">
    <section id="loginView" class="card login">
        <h2>Acesso à Área de Downloads</h2>
        <div id="loginMessage" class="message hidden"></div>
        <input id="passwordInput" type="password" placeholder="Sua senha">
        <div style="margin-top:12px">
            <button class="btn" id="loginBtn">Entrar</button>
        </div>
    </section>
    </div>

    <section id="downloadsView" class="hidden">
        <div class="card">
            <h2>Área de Downloads</h2>
            <p id="accessNote"></p>
            <div id="msgs"></div>
            <div id="adminPanel" class="hidden" style="margin-top:12px">
                <h3>Painel de Upload</h3>
                <form id="uploadForm" class="upload" enctype="multipart/form-data">
                    <input id="nm_down" name="name" type="text" placeholder="Nome visível do arquivo" required>
                    <input id="fileInput" name="file" type="file" required>
                    <div>
                        <button class="btn" type="submit">Enviar</button>
                        <button type="button" class="btn secondary" id="uploadReset">Limpar</button>
                    </div>
                </form>
            </div>
            <hr style="margin:16px 0">
            <div id="filesGrid" class="grid"></div>
        </div>
    </section>
</main>

<script>
const API_BASE = 'http://localhost:8000/api'; // ajuste se necessário

function showMessage(el, text, type='success'){
    el.className = 'message ' + (type==='error'?'error':'success');
    el.textContent = text;
    el.classList.remove('hidden');
    setTimeout(()=>el.classList.add('hidden'), 6000);
}

function setLoggedIn(role, token){
    localStorage.setItem('[REDACTED_DB_USERNAME]_token', token);
    localStorage.setItem('[REDACTED_DB_USERNAME]_role', role);
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('downloadsView').classList.remove('hidden');
    document.getElementById('logoutBtn').style.display = 'inline-block';
    document.getElementById('accessNote').innerHTML = role==='admin'? 'Você está logado como <strong>Administrador</strong>.' : 'Você está logado como <strong>Usuário</strong>.';
    if(role==='admin') document.getElementById('adminPanel').classList.remove('hidden');
}

function logout(){
    localStorage.removeItem('[REDACTED_DB_USERNAME]_token');
    localStorage.removeItem('[REDACTED_DB_USERNAME]_role');
    document.getElementById('loginView').classList.remove('hidden');
    document.getElementById('downloadsView').classList.add('hidden');
    document.getElementById('logoutBtn').style.display = 'none';
}

async function doAuth(password){
    const fd = new FormData();
    fd.append('password', password);
    const res = await fetch(`${API_BASE}/auth`, {method:'POST', body:fd});
    if(!res.ok){
        throw new Error('Erro ao autenticar');
    }
    return res.json();
}

async function loadFiles(){
    const token = localStorage.getItem('[REDACTED_DB_USERNAME]_token');
    const resp = await fetch(`${API_BASE}/files`, {headers: { 'Authorization': 'Bearer ' + token }});
    if(resp.status===401){ logout(); return; }
    const data = await resp.json();
    const grid = document.getElementById('filesGrid');
    grid.innerHTML = '';
    if(!data.files || data.files.length===0){ grid.innerHTML = '<div class="file-card">Nenhum arquivo disponível.</div>'; return; }
    data.files.forEach(f => {
        const card = document.createElement('div');
        card.className = 'file-card';
        card.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center">
                <strong style="font-size:15px">${escapeHtml(f.name)}</strong>
                <div class="file-meta">${escapeHtml(f.created_at)}</div>
            </div>
            <div class="file-meta" style="margin-top:6px">
                <span>${escapeHtml(f.filename)}</span>
                <span>
                    <button class="btn" onclick="downloadFile('${encodeURIComponent(f.filename)}')">Baixar</button>
                    ${localStorage.getItem('[REDACTED_DB_USERNAME]_role')==='admin'? `<button class='btn secondary' onclick='editFile(${f.id}, "${escapeHtml(f.name).replace(/"/g, '&quot;')}")'>Editar</button> <button class='btn secondary' onclick='deleteFile(${f.id})'>Excluir</button>` : ''}
                </span>
            </div>
        `;
        grid.appendChild(card);
    });
}

function escapeHtml(s){ return (s||'').toString().replace(/[&<>\\"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

async function downloadFile(filenameEncoded){
    const filename = decodeURIComponent(filenameEncoded);
    const token = localStorage.getItem('[REDACTED_DB_USERNAME]_token');
    const res = await fetch(`${API_BASE}/files/download/${filename}`, { headers: { 'Authorization': 'Bearer ' + token }});
    if(res.status===401){ logout(); return; }
    if(!res.ok){ alert('Erro ao baixar arquivo'); return; }
    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);
}

async function deleteFile(id){
    if(!confirm('Confirma exclusão deste arquivo?')) return;
    const token = localStorage.getItem('[REDACTED_DB_USERNAME]_token');
    const res = await fetch(`${API_BASE}/files/${id}`, { method:'DELETE', headers: { 'Authorization': 'Bearer ' + token }});
    if(res.status===401){ logout(); return; }
    if(!res.ok){ alert('Erro ao excluir'); return; }
    await loadFiles();
}

async function editFile(id, oldName){
    const newName = prompt('Informe o novo nome do arquivo:', oldName);
    if(!newName || newName === oldName) return;
    const token = localStorage.getItem('[REDACTED_DB_USERNAME]_token');
    const fd = new FormData();
    fd.append('name', newName);
    const res = await fetch(`${API_BASE}/files/${id}`, { method:'PUT', body: fd, headers: { 'Authorization': 'Bearer ' + token }});
    if(res.status===401){ logout(); return; }
    if(!res.ok){ alert('Erro ao alterar'); return; }
    await loadFiles();
}

// login handlers
document.getElementById('loginBtn').addEventListener('click', async ()=>{
    const pass = document.getElementById('passwordInput').value.trim();
    const msg = document.getElementById('loginMessage');
    if(!pass){ showMessage(msg, 'Informe a senha', 'error'); return; }
    try{
        const result = await doAuth(pass);
        if(result.status==='invalido'){
            showMessage(msg, 'Senha inválida', 'error');
            return;
        }
        setLoggedIn(result.status, result.token);
        await loadFiles();
    }catch(e){ showMessage(msg, 'Erro de conexão com a API', 'error'); }
});

// logout
document.getElementById('logoutBtn').addEventListener('click', (e)=>{ e.preventDefault(); logout(); });

// upload
const uploadForm = document.getElementById('uploadForm');
if(uploadForm){
    uploadForm.addEventListener('submit', async (ev)=>{
        ev.preventDefault();
        const name = document.getElementById('nm_down').value.trim();
        const fileInput = document.getElementById('fileInput');
        if(!name || fileInput.files.length===0){ alert('Preencha nome e selecione arquivo'); return; }
        const fd = new FormData();
        fd.append('name', name);
        fd.append('file', fileInput.files[0]);
        const token = localStorage.getItem('[REDACTED_DB_USERNAME]_token');
        const res = await fetch(`${API_BASE}/files`, { method:'POST', body: fd, headers: { 'Authorization': 'Bearer ' + token }});
        if(res.status===401){ logout(); return; }
        if(!res.ok){ alert('Erro ao enviar arquivo'); return; }
        document.getElementById('nm_down').value=''; fileInput.value='';
        await loadFiles();
        showMessage(document.getElementById('msgs'), 'Arquivo enviado com sucesso', 'success');
    });
}

// on load, restore session if exists
window.addEventListener('load', async ()=>{
    const token = localStorage.getItem('[REDACTED_DB_USERNAME]_token');
    const role = localStorage.getItem('[REDACTED_DB_USERNAME]_role');
    if(token && role){
        setLoggedIn(role, token);
        try{ await loadFiles(); }catch(e){ logout(); }
    }
});
</script>
</body>
</html>
